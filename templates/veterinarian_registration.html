
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Veterinarian Registration - PetCare</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .register-container {
            background: white;
            width: 480px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2e7d32;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        .info {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="register-container">

    <h1>🩺 Veterinarian Profile</h1>

    <p class="subtitle">
        Complete your professional details
    </p>

    <div class="info">
        Your profile will be reviewed by the administrator
        before you can provide veterinary services.
    </div>

    <form method="POST">

        <label for="profile_photo">Profile Photo</label>
        <input
            type="text"
            id="profile_photo"
            name="profile_photo"
            placeholder="Enter photo file name"
            required
        >

        <label for="qualification">Qualification</label>
        <input
            type="text"
            id="qualification"
            name="qualification"
            placeholder="Example: BVSc & AH"
            required
        >

        <label for="registration_number">Veterinary Registration Number</label>
        <input
            type="text"
            id="registration_number"
            name="registration_number"
            placeholder="Enter registration number"
            required
        >

        <label for="specialization">Specialization</label>
        <input
            type="text"
            id="specialization"
            name="specialization"
            placeholder="Example: Veterinary Surgery"
            required
        >

        <label for="experience_years">Experience (Years)</label>
        <input
            type="number"
            id="experience_years"
            name="experience_years"
            min="0"
            placeholder="Enter years of experience"
            required
        >

        <label for="clinic_name">Clinic Name</label>
        <input
            type="text"
            id="clinic_name"
            name="clinic_name"
            placeholder="Enter clinic name"
            required
        >

        <label for="clinic_address">Clinic Address</label>
        <textarea
            id="clinic_address"
            name="clinic_address"
            placeholder="Enter complete clinic address"
            required
        ></textarea>

        <label for="phone">Phone Number</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter phone number"
            required
        >

        <label for="verification_document">
            Verification Document
        </label>

        <input
            type="text"
            id="verification_document"
            name="verification_document"
            placeholder="Enter document file name"
            required
        >

        <button type="submit">
            Submit for Verification
        </button>

    </form>

</div>

</body>
</html>
