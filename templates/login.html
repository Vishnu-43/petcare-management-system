<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - PetCare</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7f9;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            margin: 0;
        }

        .login-container {
            background: white;

            width: 380px;
            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;

            margin-bottom: 6px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 11px;

            margin-bottom: 18px;

            border: 1px solid #ddd;

            border-radius: 6px;

            box-sizing: border-box;
        }

        button {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background: #2e7d32;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        .register-link {
            text-align: center;

            margin-top: 20px;
        }

        .register-link a {
            color: #2e7d32;

            text-decoration: none;
        }

        .message {
            background: #ffebee;

            color: #c62828;

            padding: 10px;

            border-radius: 6px;

            margin-bottom: 15px;

            text-align: center;
        }

    </style>

</head>


<body>

<div class="login-container">

    <h1>🐾 PetCare</h1>

    <p class="subtitle">
        Welcome back!
    </p>


    {% if error %}

        <div class="message">
            {{ error }}
        </div>

    {% endif %}


    <form method="POST">

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <div class="register-link">

        Don't have an account?

        <a href="{{ url_for('register') }}">
            Create account
        </a>

    </div>

</div>

</body>

</html>
